# SPDX-License-Identifier: Apache-2.0
name: Repository checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check portable repository contents
        run: python scripts/check-portability.py
      - name: Check documentation and environment template
        run: python scripts/check-docs.py

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 36d36cba938ab660ad25c71c0afbb0d3f5963ff3
          path: .local/geometry-source
      - name: Configure geometry dependency
        run: cmake -S .local/geometry-source -B .local/geometry-build -DCMAKE_BUILD_TYPE=Release
      - name: Build geometry dependency
        run: cmake --build .local/geometry-build --config Release
      - name: Test geometry dependency
        run: ctest --test-dir .local/geometry-build -C Release --output-on-failure
      - name: Install geometry dependency
        run: cmake --install .local/geometry-build --config Release --prefix .local/install
      - name: Configure repair against installed geometry
        run: cmake -S . -B .local/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build repair
        run: cmake --build .local/build --config Release
      - name: Test duplicate operation
        run: ctest --test-dir .local/build -C Release --output-on-failure
      - name: Install repair
        run: cmake --install .local/build --config Release --prefix .local/install
      - name: Configure installed consumer
        run: cmake -S examples/consumer -B .local/consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install"
      - name: Build installed consumer
        run: cmake --build .local/consumer --config Release
      - name: Test installed consumer
        run: ctest --test-dir .local/consumer -C Release --output-on-failure

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.local/vcpkg-runtime
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 36d36cba938ab660ad25c71c0afbb0d3f5963ff3
          fetch-depth: 0
          path: .local/geometry-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-interchange
          ref: 91f1102105e0b94cf914b3994310a10cfe3e0d28
          fetch-depth: 0
          path: .local/interchange-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/vcpkg-runtime
      - name: Bootstrap pinned dependency tooling
        run: |
          if ($IsWindows) {
            & .local/vcpkg-runtime/bootstrap-vcpkg.bat -disableMetrics
          } else {
            & bash .local/vcpkg-runtime/bootstrap-vcpkg.sh -disableMetrics
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = if ($IsWindows) { "x64-windows-static-md" } elseif ($IsMacOS) {
            if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
              "arm64-osx"
            } else { "x64-osx" }
          } else { "x64-linux" }
          "MESHVALE_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install native Geometry headers
        run: |
          cmake -S .local/geometry-source -B .local/geometry-build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .local/geometry-build --config Release --prefix .local/geometry-prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Interchange's pinned double-precision parser
        run: |
          & "$env:VCPKG_ROOT/vcpkg" install --triplet $env:MESHVALE_TRIPLET "--x-manifest-root=${{ github.workspace }}/.local/interchange-source" "--x-install-root=${{ github.workspace }}/.local/dependencies"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source distributions and wheels
        run: |
          python -m pip install build==1.6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build .local/geometry-source --outdir .local/geometry-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build .local/interchange-source --outdir .local/interchange-wheels "--config-setting=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/geometry-prefix;${{ github.workspace }}/.local/dependencies/$env:MESHVALE_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --outdir .local/dist "--config-setting=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/geometry-prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect dependency packages
        shell: bash
        run: |
          python .local/geometry-source/scripts/check-package.py .local/geometry-wheels/*.whl .local/geometry-wheels/*.tar.gz
          python .local/interchange-source/scripts/check-package.py .local/interchange-wheels/*.whl .local/interchange-wheels/*.tar.gz
      - name: Inspect Repair packages
        shell: bash
        run: python scripts/check-package.py .local/dist/*.whl .local/dist/*.tar.gz
      - name: Test clean installed OBJ workflow and all product import orders
        shell: bash
        run: python scripts/test-installed.py --geometry-wheel .local/geometry-wheels/*.whl --repair-wheel .local/dist/*.whl --workflow --interchange-wheel .local/interchange-wheels/*.whl
