# SPDX-License-Identifier: Apache-2.0
name: Repository checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check portable repository contents
        run: python scripts/check-portability.py
      - name: Check documentation and environment template
        run: python scripts/check-docs.py
      - name: Install pinned C++ formatter
        run: python -m pip install clang-format==23.1.3
      - name: Check C++ formatting
        run: python scripts/check-cpp-format.py

  native:
    name: Native ${{ matrix.profile_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_id: windows-msvc-qualified
            os: windows-latest
            compiler_id: MSVC
            compiler_version: ""
            compiler_option: ""
            build_type: Release
            materialization_profile: qualified
            compile_flags: /EHsc
            link_flags: ""
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: windows-msvc-asan-qualified
            os: windows-latest
            compiler_id: MSVC
            compiler_version: ""
            compiler_option: ""
            build_type: RelWithDebInfo
            materialization_profile: qualified
            compile_flags: /EHsc /fsanitize=address /Zi
            link_flags: /INCREMENTAL:NO
            asan_options: alloc_dealloc_mismatch=1
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 48298b24be7c132816fb5580d22d58bde61558d0
          - profile_id: linux-clang-qualified
            os: ubuntu-24.04
            compiler_id: Clang
            compiler_version: "18.1.3"
            compiler_option: -DCMAKE_CXX_COMPILER=clang++-18
            build_type: Debug
            materialization_profile: qualified
            compile_flags: ""
            link_flags: ""
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: linux-clang-asan-ubsan-qualified
            os: ubuntu-24.04
            compiler_id: Clang
            compiler_version: "18.1.3"
            compiler_option: -DCMAKE_CXX_COMPILER=clang++-18
            build_type: Debug
            materialization_profile: qualified
            compile_flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            link_flags: -fsanitize=address,undefined
            asan_options: detect_leaks=1:halt_on_error=1
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: linux-clang-tsan-real-workers
            os: ubuntu-24.04
            compiler_id: Clang
            compiler_version: "18.1.3"
            compiler_option: -DCMAKE_CXX_COMPILER=clang++-18
            build_type: Debug
            materialization_profile: qualified
            compile_flags: -fsanitize=thread -O1 -g -fno-omit-frame-pointer
            link_flags: -fsanitize=thread
            allocation_probe: disabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: linux-gcc-unsupported
            os: ubuntu-24.04
            compiler_id: GNU
            compiler_version: ""
            compiler_option: -DCMAKE_CXX_COMPILER=g++
            build_type: Release
            materialization_profile: unsupported
            compile_flags: ""
            link_flags: ""
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: macos-appleclang-unsupported
            os: macos-latest
            compiler_id: AppleClang
            compiler_version: ""
            compiler_option: -DCMAKE_CXX_COMPILER=clang++
            build_type: Release
            materialization_profile: unsupported
            compile_flags: ""
            link_flags: ""
            allocation_probe: enabled
            module: "ON"
            geometry_revision: 1a364acb0cba4fbf8cd9cccde5c04a1fa4428536
          - profile_id: windows-msvc-legacy-off
            os: windows-latest
            compiler_id: MSVC
            compiler_version: ""
            compiler_option: ""
            build_type: Release
            materialization_profile: "off"
            compile_flags: /EHsc
            link_flags: ""
            allocation_probe: enabled
            module: "OFF"
            geometry_revision: ec38fabd783a578947d43856b0c7a7fd54ce8533
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: ${{ matrix.geometry_revision }}
          path: .local/geometry-source
      - name: Configure geometry dependency
        run: |
          $options = @('-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', '-DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON', '-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}', '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}', '-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.link_flags }}')
          if ('${{ matrix.compiler_option }}') { $options += '${{ matrix.compiler_option }}' }
          if ('${{ matrix.module }}' -eq 'ON') {
            $options += '-DMESHVALE_GEOMETRY_MATERIALIZATION_TEST_PROFILE=${{ matrix.materialization_profile }}'
            $options += '-DMESHVALE_GEOMETRY_ALLOCATION_PROBE=${{ matrix.allocation_probe == 'enabled' && 'ON' || 'OFF' }}'
          }
          cmake -S .local/geometry-source -B .local/geometry-build @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build geometry dependency
        run: |
          if ('${{ matrix.profile_id }}' -eq 'windows-msvc-asan-qualified') {
            New-Item -ItemType Directory -Force .local/windows-startup | Out-Null
            cmake --build .local/geometry-build --config ${{ matrix.build_type }} --parallel 2 --verbose 2>&1 | Tee-Object .local/windows-startup/build.log
            $buildExit = $LASTEXITCODE
            @{ exit_code = $buildExit; configuration = '${{ matrix.build_type }}' } | ConvertTo-Json | Set-Content .local/windows-startup/build-result.json
            exit $buildExit
          }
          cmake --build .local/geometry-build --config ${{ matrix.build_type }} --parallel 2
      - name: Check actual geometry test inventory
        if: matrix.module == 'ON'
        run: |
          $options = @('--build-dir', '.local/geometry-build', '--configuration', '${{ matrix.build_type }}', '--materialization-profile', '${{ matrix.materialization_profile }}', '--allocation-probe', '${{ matrix.allocation_probe }}', '--compiler-id', '${{ matrix.compiler_id }}')
          if ('${{ matrix.compiler_version }}') { $options += @('--compiler-version', '${{ matrix.compiler_version }}') }
          python .local/geometry-source/scripts/check-native-tests.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Expose configured Windows sanitizer runtime
        if: matrix.profile_id == 'windows-msvc-asan-qualified'
        run: |
          New-Item -ItemType Directory -Force .local/windows-startup | Out-Null
          $compilerRecords = @(Get-ChildItem .local/geometry-build/CMakeFiles/*/CMakeCXXCompiler.cmake)
          if ($compilerRecords.Count -ne 1) { throw 'Expected one configured compiler record' }
          $compilerRecord = $compilerRecords[0]
          $compilerText = Get-Content -LiteralPath $compilerRecord.FullName -Raw
          $compilerMatch = [regex]::Match($compilerText, 'set\(CMAKE_CXX_COMPILER "([^"]+)"\)')
          if (-not $compilerMatch.Success) { throw 'Configured compiler path is missing' }
          $runtimeDirectory = [System.IO.Path]::GetFullPath((Split-Path -Parent $compilerMatch.Groups[1].Value))
          $runtimeName = 'clang_rt.asan_dynamic-x86_64.dll'
          $runtime = Get-Item -LiteralPath (Join-Path $runtimeDirectory $runtimeName) -ErrorAction Stop
          if ($runtime.PSIsContainer) { throw 'Configured release sanitizer runtime must be a file' }
          $receipt = @{
            runtime_directory = $runtimeDirectory
            runtime_path = $runtime.FullName
            runtime_sha256 = (Get-FileHash -LiteralPath $runtime.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            compiler_record_sha256 = (Get-FileHash -LiteralPath $compilerRecord.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $receipt | ConvertTo-Json | Set-Content .local/windows-startup/runtime-path.json
          $runtimeDirectory | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Capture bounded Windows sanitizer process diagnostics
        id: windows-startup
        if: matrix.profile_id == 'windows-msvc-asan-qualified'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $configuration = '${{ matrix.build_type }}'
          $runtimeReceipt = Get-Content .local/windows-startup/runtime-path.json -Raw | ConvertFrom-Json
          $runtimeDirectory = [System.IO.Path]::TrimEndingDirectorySeparator($runtimeReceipt.runtime_directory)
          $runtimePresent = $false
          foreach ($entry in ($env:PATH -split [System.IO.Path]::PathSeparator)) {
            if ([string]::IsNullOrWhiteSpace($entry)) { continue }
            $entryDirectory = [System.IO.Path]::TrimEndingDirectorySeparator([System.IO.Path]::GetFullPath($entry.Trim('"')))
            if ([System.StringComparer]::OrdinalIgnoreCase.Equals($entryDirectory, $runtimeDirectory)) { $runtimePresent = $true }
          }
          $currentRuntimeHash = (Get-FileHash -LiteralPath $runtimeReceipt.runtime_path -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            runtime_directory = $runtimeDirectory
            runtime_path = $runtimeReceipt.runtime_path
            runtime_sha256 = $currentRuntimeHash
            directory_present_in_path = $runtimePresent
          } | ConvertTo-Json | Set-Content .local/windows-startup/runtime-path-membership.json
          if (-not $runtimePresent -or $currentRuntimeHash -ne $runtimeReceipt.runtime_sha256) { throw 'Configured sanitizer runtime PATH admission failed' }
          $ctest = (Get-Command ctest -ErrorAction Stop).Source
          $inventoryText = & $ctest --test-dir .local/geometry-build -C $configuration --show-only=json-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventoryText | Set-Content .local/windows-startup/inventory.json
          $inventory = ($inventoryText -join "`n") | ConvertFrom-Json
          $compilerRecord = @(Get-ChildItem .local/geometry-build/CMakeFiles/*/CMakeCXXCompiler.cmake)
          if ($compilerRecord.Count -ne 1) { throw 'Expected one configured compiler record' }
          $compilerText = Get-Content -LiteralPath $compilerRecord[0].FullName -Raw
          $compilerMatch = [regex]::Match($compilerText, 'set\(CMAKE_CXX_COMPILER "([^"]+)"\)')
          if (-not $compilerMatch.Success) { throw 'Configured compiler path is missing' }
          $compilerDirectory = Split-Path -Parent $compilerMatch.Groups[1].Value
          $runtimes = @(Get-ChildItem -LiteralPath $compilerDirectory -Filter '*asan*.dll' -File)
          if ($runtimes.Count -eq 0) { throw 'No sanitizer runtime found beside the configured compiler' }
          $diagnosticNames = @('checked_attribute_numerics', 'charged_materialization', 'materialization_semantics')
          $deadlineSeconds = 20
          $failed = $false
          foreach ($testName in $diagnosticNames) {
            $test = @($inventory.tests | Where-Object name -eq $testName)
            if ($test.Count -ne 1 -or -not $test[0].command) { throw "Missing configured test command: $testName" }
            $pdb = [System.IO.Path]::ChangeExtension($test[0].command[0], '.pdb')
            $options = @('--ctest', $ctest, '--build-dir', '.local/geometry-build', '--configuration', $configuration, '--test-name', $testName, '--output', ".local/windows-startup/$testName", '--timeout-seconds', $deadlineSeconds, '--pdb', $pdb)
            foreach ($runtime in $runtimes) { $options += @('--runtime-dll', $runtime.FullName) }
            python scripts/diagnose-windows-startup.py @options
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Test geometry dependency
        run: ctest --test-dir .local/geometry-build -C ${{ matrix.build_type }} --output-on-failure
      - name: Require successful Windows sanitizer diagnostics
        if: always() && steps.windows-startup.outcome == 'failure'
        run: exit 1
      - name: Install geometry dependency
        run: cmake --install .local/geometry-build --config ${{ matrix.build_type }} --prefix .local/install
      - name: Configure repair against installed geometry
        run: |
          $options = @('-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', '-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}', '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}', '-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.link_flags }}', '-DMESHVALE_REPAIR_MATERIALIZED_DUPLICATES=${{ matrix.module }}', '-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/install')
          if ('${{ matrix.compiler_option }}') { $options += '${{ matrix.compiler_option }}' }
          if ('${{ matrix.module }}' -eq 'ON') { $options += '-DMESHVALE_REPAIR_MATERIALIZED_TEST_PROFILE=${{ matrix.materialization_profile }}' }
          cmake -S . -B .local/build @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build repair
        run: cmake --build .local/build --config ${{ matrix.build_type }} --parallel 2
      - name: Check actual repair test inventory
        run: |
          $options = @('--build-dir', '.local/build', '--configuration', '${{ matrix.build_type }}', '--materialization-profile', '${{ matrix.materialization_profile }}', '--compiler-id', '${{ matrix.compiler_id }}')
          if ('${{ matrix.compiler_version }}') { $options += @('--compiler-version', '${{ matrix.compiler_version }}') }
          python scripts/check-native-tests.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test duplicate operation
        run: ctest --test-dir .local/build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install repair
        run: cmake --install .local/build --config ${{ matrix.build_type }} --prefix .local/install
      - name: Relocate installed packages
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $localRoot = [System.IO.Path]::GetFullPath((Join-Path $workspace '.local')) + [System.IO.Path]::DirectorySeparatorChar
          $source = (Resolve-Path -LiteralPath .local/install).Path
          $destination = [System.IO.Path]::GetFullPath((Join-Path $workspace '.local/relocated-install'))
          foreach ($path in @($source, $destination)) {
            if (-not $path.StartsWith($localRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Install relocation must stay in the workspace local directory' }
          }
          if (Test-Path -LiteralPath $destination) { throw 'Relocation destination already exists' }
          Move-Item -LiteralPath $source -Destination $destination -ErrorAction Stop
      - name: Configure installed consumer
        run: |
          $options = @('-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', '-DCMAKE_CXX_FLAGS=${{ matrix.compile_flags }}', '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link_flags }}', '-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.link_flags }}', '-DCMAKE_PREFIX_PATH=${{ github.workspace }}/.local/relocated-install')
          if ('${{ matrix.compiler_option }}') { $options += '${{ matrix.compiler_option }}' }
          if ('${{ matrix.module }}' -eq 'ON') { $options += '-DMESHVALE_REPAIR_MATERIALIZED_TEST_PROFILE=${{ matrix.materialization_profile }}' }
          cmake -S examples/consumer -B .local/consumer @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installed consumer
        run: cmake --build .local/consumer --config ${{ matrix.build_type }} --parallel 2
      - name: Check actual relocated consumer inventory
        run: |
          $options = @('--build-dir', '.local/build', '--installed-build-dir', '.local/consumer', '--configuration', '${{ matrix.build_type }}', '--materialization-profile', '${{ matrix.materialization_profile }}', '--compiler-id', '${{ matrix.compiler_id }}')
          if ('${{ matrix.compiler_version }}') { $options += @('--compiler-version', '${{ matrix.compiler_version }}') }
          python scripts/check-native-tests.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed consumer
        run: ctest --test-dir .local/consumer -C ${{ matrix.build_type }} --output-on-failure
      - name: Retain native qualification records
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: repair-native-${{ matrix.profile_id }}
          path: |
            .local/windows-startup
            .local/geometry-build/**/*.tlog
            .local/geometry-build/**/*.rsp
            .local/geometry-build/**/*.vcxproj
            .local/geometry-build/**/*.props
            .local/geometry-build/**/*.targets
            .local/geometry-build/CMakeCache.txt
            .local/geometry-build/CMakeFiles/*/CMakeCXXCompiler.cmake
            .local/geometry-build/compile_commands.json
            .local/geometry-build/Testing
            .local/build/CMakeCache.txt
            .local/build/CMakeFiles/*/CMakeCXXCompiler.cmake
            .local/build/compile_commands.json
            .local/build/Testing
            .local/consumer/CMakeCache.txt
            .local/consumer/CMakeFiles/*/CMakeCXXCompiler.cmake
            .local/consumer/compile_commands.json
            .local/consumer/Testing
            .local/relocated-install
          include-hidden-files: true
          retention-days: 14

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.local/vcpkg-runtime
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: ec38fabd783a578947d43856b0c7a7fd54ce8533
          fetch-depth: 0
          path: .local/geometry-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-interchange
          ref: 8d5823272b576052553608dbff26685ba56b4dea
          fetch-depth: 0
          path: .local/interchange-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: cb5a41b03cde4086d554b3f3e2eac39206b16eda
          path: .local/vcpkg-runtime
      - name: Bootstrap pinned dependency tooling
        run: |
          if ($IsWindows) {
            & .local/vcpkg-runtime/bootstrap-vcpkg.bat -disableMetrics
          } else {
            & bash .local/vcpkg-runtime/bootstrap-vcpkg.sh -disableMetrics
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triplet = if ($IsWindows) { "x64-windows-static-md" } elseif ($IsMacOS) {
            if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
              "arm64-osx"
            } else { "x64-osx" }
          } else { "x64-linux" }
          "MESHVALE_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install native Geometry headers
        run: |
          cmake -S .local/geometry-source -B .local/geometry-build -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .local/geometry-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .local/geometry-build --config Release --prefix .local/geometry-prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Interchange's pinned double-precision parser
        run: |
          & "$env:VCPKG_ROOT/vcpkg" install --triplet $env:MESHVALE_TRIPLET "--x-manifest-root=${{ github.workspace }}/.local/interchange-source" "--x-install-root=${{ github.workspace }}/.local/dependencies"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source distributions and wheels
        run: |
          python -m pip install build==1.6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build .local/geometry-source --outdir .local/geometry-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build .local/interchange-source --outdir .local/interchange-wheels "--config-setting=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/geometry-prefix;${{ github.workspace }}/.local/dependencies/$env:MESHVALE_TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --outdir .local/dist "--config-setting=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/.local/geometry-prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect dependency packages
        shell: bash
        run: |
          python .local/geometry-source/scripts/check-package.py .local/geometry-wheels/*.whl .local/geometry-wheels/*.tar.gz
          python .local/interchange-source/scripts/check-package.py .local/interchange-wheels/*.whl .local/interchange-wheels/*.tar.gz
      - name: Inspect Repair packages
        shell: bash
        run: python scripts/check-package.py .local/dist/*.whl .local/dist/*.tar.gz
      - name: Test clean installed OBJ workflow and all product import orders
        shell: bash
        run: python scripts/test-installed.py --geometry-wheel .local/geometry-wheels/*.whl --repair-wheel .local/dist/*.whl --workflow --interchange-wheel .local/interchange-wheels/*.whl
