# SPDX-License-Identifier: Apache-2.0
name: Portable Repair development cohort

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/portable-candidates.yml
      - scripts/portable-preview.py
      - scripts/check-package.py
      - scripts/check-gltf-python-return.py
      - scripts/gltf-deformation-test-evidence.py
      - scripts/check-gltf-deformation-python.py
      - scripts/gltf_deformation_test_support.py
      - scripts/gltf-deformation-domain/**
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - src/**
      - include/**
      - python/**
      - tests/**
      - examples/**

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            identifier: cp313-manylinux_x86_64
            arch: x86_64
          - os: windows-2022
            identifier: cp313-win_amd64
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CIBW_BUILD: ${{ matrix.identifier }}
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_DEPENDENCY_VERSIONS: pinned
      CIBW_BUILD_FRONTEND: build
      CIBW_CONFIG_SETTINGS: cmake.version===4.3.1
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
      CIBW_BEFORE_ALL_LINUX: yum install -y zip-3.0-23.el8
      CIBW_ENVIRONMENT_LINUX: >-
        MESHVALE_DEPS=/tmp/meshvale-repair-preview MESHVALE_PREVIEW_DIR=/output
        CMAKE_PREFIX_PATH=/tmp/meshvale-repair-preview/interchange-prefix:/tmp/meshvale-repair-preview/prefix:/tmp/meshvale-repair-preview/dependencies/x64-linux
        VCPKG_DISABLE_METRICS=1
      CIBW_BEFORE_BUILD: >-
        python -m pip install --only-binary=:all: cmake==4.3.1 && python -m pip freeze && cmake --version &&
        python "{package}/scripts/portable-preview.py" prepare
      CIBW_BEFORE_TEST: python "{package}/scripts/portable-preview.py" before-test
      CIBW_TEST_REQUIRES: jsonschema==4.26.0
      CIBW_TEST_COMMAND: python "{package}/scripts/portable-preview.py" test
      CIBW_REPAIR_WHEEL_COMMAND: >-
        python "{package}/scripts/portable-preview.py" repair --wheel "{wheel}" --destination "{dest_dir}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned packaging frontend
        run: python -m pip install cibuildwheel==4.2.0 build==1.6.1
      - name: Select Windows x64 compiler environment for the isolated return test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) { throw 'No Windows x64 compiler environment' }
          $environment = & cmd /d /c "call `"$visualStudio/Common7/Tools/VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerVariables = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCINSTALLDIR', 'VCToolsInstallDir', 'UniversalCRTSdkDir', 'UCRTVersion')
          foreach ($line in $environment) {
            $name, $value = $line -split '=', 2
            if ($name -in $compilerVariables) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Record hosted environment and Windows dependency prefixes
        shell: bash
        run: |
          mkdir -p .local/preview
          python - <<'PY'
          import os
          from pathlib import Path
          preview = (Path(os.environ['GITHUB_WORKSPACE']) / '.local/preview').as_posix()
          dependencies = (Path(os.environ['GITHUB_WORKSPACE']) / '.local/portable-dependencies').as_posix()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('MESHVALE_PREVIEW_ROOT=' + preview + '\n')
              stream.write('MESHVALE_DEPS=' + dependencies + '\n')
              stream.write('MESHVALE_PREFIXES=' + dependencies + '/interchange-prefix;' + dependencies + '/prefix;' + dependencies + '/dependencies/x64-windows-static-md\n')
          PY
          python -m pip freeze > .local/preview/host-tools.txt
          python -m cibuildwheel --print-build-identifiers > .local/preview/build-identifiers.txt
          python -c "import os,platform,sys; print(platform.platform()); print(sys.version); print('Runner image:',os.environ.get('ImageOS'),os.environ.get('ImageVersion'))" > .local/preview/host.txt
      - name: Build and inspect source distribution
        shell: bash
        run: |
          python -m build --sdist --outdir .local/preview/sdist
          python scripts/check-package.py .local/preview/sdist/*.tar.gz
      - name: Qualify one separate normal source and genuine-SDIST deformation pair
        shell: bash
        env:
          MESHVALE_DEPS: ${{ github.workspace }}/.local/deformation-dependencies
          MESHVALE_PREVIEW_DIR: ${{ github.workspace }}/.local/preview/deformation-owned
          CMAKE_GENERATOR: Ninja
        run: |
          python -m pip install cmake==4.3.1 scikit-build-core==1.1.1 nanobind==3.1.0 setuptools-scm==10.3.4
          python scripts/portable-preview.py qualify-deformation
      - name: Build, inspect and test repaired source candidate baseline
        run: python -m cibuildwheel --output-dir .local/preview/source-wheels
        env:
          CIBW_ENVIRONMENT_WINDOWS: >-
            MESHVALE_DEPS="$MESHVALE_DEPS" MESHVALE_PREVIEW_DIR="$MESHVALE_PREVIEW_ROOT/source-wheels"
            CMAKE_PREFIX_PATH="$MESHVALE_PREFIXES" VCPKG_DISABLE_METRICS=1
      - name: Rebuild, inspect and test repaired archive candidate baseline
        shell: bash
        run: python -m cibuildwheel .local/preview/sdist/*.tar.gz --output-dir .local/preview/wheels
        env:
          CIBW_ENVIRONMENT_WINDOWS: >-
            MESHVALE_DEPS="$MESHVALE_DEPS" MESHVALE_PREVIEW_DIR="$MESHVALE_PREVIEW_ROOT/wheels"
            CMAKE_PREFIX_PATH="$MESHVALE_PREFIXES" VCPKG_DISABLE_METRICS=1
      - name: Load public Geometry verification source on Linux host
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-geometry
          ref: 48298b24be7c132816fb5580d22d58bde61558d0
          path: .local/portable-dependencies/geometry
          persist-credentials: false
      - name: Load public Interchange verification source on Linux host
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-interchange
          ref: 5b9b695ba1fef166baa8c7cf9ad21a5630691f70
          path: .local/portable-dependencies/interchange
          persist-credentials: false
      - name: Load public native Interchange verification source on Linux host
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Meshvale/meshvale-interchange
          ref: 88acdba9046352b84d3dea90648e3d271629f511
          path: .local/portable-dependencies/interchange-native-source
          persist-credentials: false
      - name: Inspect final publication contents and record exact identities
        shell: bash
        run: |
          python scripts/check-package.py .local/preview/source-wheels/*.whl .local/preview/wheels/*.whl
          python scripts/portable-preview.py manifest --output .local/preview
      - name: Retain development candidates and their notices
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: repair-development-${{ matrix.identifier }}
          path: |
            .local/preview
            .local/d
            .local/deformation-dependencies
            !.local/deformation-dependencies/**/.git/**
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
