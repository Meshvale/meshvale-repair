# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0", "setuptools-scm==10.3.4"]
build-backend = "scikit_build_core.build"

[project]
name = "meshvale-repair"
dynamic = ["version"]
description = "Conservative targeted duplicate repair with polygon attribute preservation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Meshvale contributors"}]
dependencies = ["meshvale-geometry==0.0.1.dev22+g273b68991"]

[project.optional-dependencies]
workflow = ["meshvale-geometry[reports]==0.0.1.dev22+g273b68991"]
assets = ["meshvale-geometry[reports]==0.0.1.dev22+g273b68991", "meshvale-interchange==0.0.1.dev23+g61bc9641a"]

[project.scripts]
meshvale-repair = "meshvale_repair.commands:main"

[project.urls]
Repository = "https://github.com/Meshvale/meshvale-repair"
Issues = "https://github.com/Meshvale/meshvale-repair/issues"

[tool.scikit-build]
minimum-version = "1.1"
wheel.packages = ["python/meshvale_repair"]
install.components = ["python"]
cmake.define.MESHVALE_REPAIR_PYTHON = true
cmake.define.BUILD_TESTING = false
sdist.include = [".clang-format", "CMakeLists.txt", "pyproject.toml", "README.md", "AGENTS.md", "ENVIRONMENT.md", "environment.example.json", "LICENSE", "NOTICE", "THIRD_PARTY.md", "CHANGELOG.md", "cmake/**", "include/**", "src/**", "python/bindings.cpp", "python/meshvale_repair/*.py", "docs/**", "examples/**", "tests/**", "licenses/*.txt", "scripts/*.py"]
sdist.inclusion-mode = "explicit"
sdist.exclude = ["**/__pycache__/**", "**/*.pyc", "**/.local/**", "**/.scratch/**", "**/build/**", "**/references/**"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
version_file = "python/meshvale_repair/_version.py"
fallback_version = "0.0.0"
